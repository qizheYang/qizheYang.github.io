<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清一色听牌分析器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a1a;
  --surface: #242424;
  --surface-hover: #2e2e2e;
  --border: #3a3a3a;
  --text: #e8e0d4;
  --text-dim: #8a8278;
  --accent: #c7956d;
  --accent-bright: #e0b088;
  --gold: #d4a853;
  --red: #c44d3a;
  --green: #5a9e6f;
  --tile-face: #f5f0e8;
  --tile-shadow: #c8bfb0;
  --tile-border: #a89e90;
  --tile-selected: #ffeedd;
  --other-face: #e0e8f0;
  --other-border: #8898a8;
  --other-shadow: #a0b0c0;
}

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 3rem;
  color: var(--accent-bright);
  letter-spacing: 0.15em;
  margin-bottom: 0.3rem;
  text-shadow: 0 2px 20px rgba(199, 149, 109, 0.3);
}

header p {
  color: var(--text-dim);
  font-size: 0.9rem;
  letter-spacing: 0.05em;
}

.input-section {
  margin-bottom: 2rem;
}

.input-section label {
  display: block;
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
  letter-spacing: 0.03em;
}

.tile-row-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  margin-top: 12px;
  letter-spacing: 0.03em;
}

.tile-row-label:first-of-type { margin-top: 0; }

.tile-selector {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.tile-btn {
  width: 58px;
  height: 76px;
  border: 2px solid var(--tile-border);
  border-radius: 6px;
  background: linear-gradient(170deg, var(--tile-face) 0%, #ece5d8 100%);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 1.8rem;
  font-weight: 900;
  color: #2a2520;
  box-shadow: 0 3px 0 var(--tile-shadow), 0 4px 8px rgba(0,0,0,0.3);
  transition: all 0.12s ease;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.tile-btn.other-tile {
  background: linear-gradient(170deg, var(--other-face) 0%, #d0d8e0 100%);
  border-color: var(--other-border);
  box-shadow: 0 3px 0 var(--other-shadow), 0 4px 8px rgba(0,0,0,0.3);
  width: 68px;
}

.tile-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 var(--tile-shadow), 0 6px 12px rgba(0,0,0,0.35);
}

.tile-btn.other-tile:hover {
  box-shadow: 0 5px 0 var(--other-shadow), 0 6px 12px rgba(0,0,0,0.35);
}

.tile-btn:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 var(--tile-shadow), 0 2px 4px rgba(0,0,0,0.25);
}

.tile-btn .tile-count {
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  color: #fff;
  background: var(--red);
  border-radius: 50%;
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.15s ease;
}

.tile-btn .tile-count.visible {
  opacity: 1;
  transform: scale(1);
}

.tile-btn .tile-label {
  font-size: 0.6rem;
  color: var(--red);
  font-weight: 700;
  margin-top: -2px;
  letter-spacing: -0.02em;
}

.tile-btn.other-tile .tile-label {
  color: #4a6080;
}

.tile-char { line-height: 1; }

.hand-display {
  min-height: 68px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 1rem;
  position: relative;
}

.hand-display.empty::after {
  content: '点击上方牌面添加手牌...';
  color: var(--text-dim);
  font-size: 0.85rem;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.hand-tile {
  width: 38px;
  height: 52px;
  border: 1.5px solid var(--tile-border);
  border-radius: 4px;
  background: linear-gradient(170deg, var(--tile-face) 0%, #ece5d8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 1.2rem;
  font-weight: 900;
  color: #2a2520;
  box-shadow: 0 2px 0 var(--tile-shadow), 0 2px 4px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: all 0.12s ease;
  animation: tileIn 0.2s ease;
}

.hand-tile.other {
  background: linear-gradient(170deg, var(--other-face) 0%, #d0d8e0 100%);
  border-color: var(--other-border);
  box-shadow: 0 2px 0 var(--other-shadow), 0 2px 4px rgba(0,0,0,0.2);
  color: #4a6080;
  font-size: 0.85rem;
}

@keyframes tileIn {
  from { transform: scale(0.7) translateY(-10px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.hand-tile:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 0 var(--tile-shadow), 0 6px 12px rgba(0,0,0,0.3);
  border-color: var(--red);
}

.hand-tile.other:hover {
  box-shadow: 0 6px 0 var(--other-shadow), 0 6px 12px rgba(0,0,0,0.3);
  border-color: var(--red);
}

.hand-separator {
  width: 2px;
  height: 40px;
  background: var(--border);
  margin: 0 6px;
  border-radius: 1px;
}

.hand-count {
  position: absolute;
  right: 12px;
  top: -10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2px 10px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.03em;
}

.btn:hover { background: var(--surface-hover); border-color: var(--accent); }

.btn-primary {
  background: var(--accent);
  color: #1a1a1a;
  border-color: var(--accent);
  font-weight: 700;
}

.btn-primary:hover {
  background: var(--accent-bright);
  border-color: var(--accent-bright);
}

.btn-danger {
  border-color: var(--red);
  color: var(--red);
}

.btn-danger:hover {
  background: var(--red);
  color: #fff;
}

.results { animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
  margin-bottom: 1rem;
}

.result-card h3 {
  font-size: 1rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.result-win {
  border-color: var(--gold);
  background: linear-gradient(135deg, var(--surface) 0%, rgba(212, 168, 83, 0.08) 100%);
}

.result-win h3 { color: var(--gold); }

.result-tenpai {
  border-color: var(--green);
  background: linear-gradient(135deg, var(--surface) 0%, rgba(90, 158, 111, 0.08) 100%);
}

.result-tenpai h3 { color: var(--green); }
.result-none h3 { color: var(--text-dim); }

.wait-tiles {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 0.75rem;
}

.wait-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.wait-tile .hand-tile {
  cursor: default;
  border-color: var(--green);
  background: linear-gradient(170deg, #f0f8f2 0%, #e5efe8 100%);
}

.wait-tile .hand-tile.other {
  border-color: var(--green);
  background: linear-gradient(170deg, #e8f0f8 0%, #dce8f0 100%);
}

.wait-tile .remaining {
  font-size: 0.7rem;
  color: var(--text-dim);
}

.wait-summary {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-top: 0.5rem;
}

.discard-option {
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 0.75rem;
  transition: all 0.15s ease;
  background: transparent;
}

.discard-option.best {
  border-color: var(--gold);
  background: rgba(212, 168, 83, 0.05);
}

.discard-option-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0.5rem;
}

.discard-option-header .star {
  color: var(--gold);
  font-size: 1.1rem;
}

.discard-label {
  font-size: 0.85rem;
  color: var(--text-dim);
}

.discard-tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 44px;
  border: 1.5px solid var(--red);
  border-radius: 4px;
  background: linear-gradient(170deg, #fdf0e8 0%, #f5e5d8 100%);
  font-family: 'Noto Serif SC', serif;
  font-size: 1rem;
  font-weight: 900;
  color: var(--red);
  box-shadow: 0 2px 0 #d4b8a0;
}

.discard-tile.other {
  background: linear-gradient(170deg, #e8eef5 0%, #dce4ee 100%);
  border-color: #6080a0;
  color: #4a6080;
  box-shadow: 0 2px 0 var(--other-shadow);
  font-size: 0.75rem;
}

.error-msg {
  padding: 0.75rem 1rem;
  background: rgba(196, 77, 58, 0.1);
  border: 1px solid var(--red);
  border-radius: 6px;
  color: var(--red);
  font-size: 0.85rem;
  margin-bottom: 1rem;
  animation: fadeIn 0.2s ease;
}

.info-box {
  padding: 0.75rem 1rem;
  background: rgba(199, 149, 109, 0.08);
  border: 1px solid rgba(199, 149, 109, 0.3);
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 0.8rem;
  margin-bottom: 1.5rem;
  line-height: 1.6;
}

footer {
  text-align: center;
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.8rem;
}

footer a {
  color: var(--accent);
  text-decoration: none;
}

footer a:hover { text-decoration: underline; }

@media (max-width: 600px) {
  .container { padding: 1.5rem 1rem 3rem; }
  header h1 { font-size: 2.2rem; }
  .tile-btn { width: 50px; height: 66px; font-size: 1.5rem; }
  .tile-btn.other-tile { width: 58px; }
  .hand-tile { width: 34px; height: 46px; font-size: 1rem; }
  .hand-tile.other { font-size: 0.75rem; }
  .tile-selector { gap: 4px; }
}

@media (max-width: 400px) {
  .tile-btn { width: 44px; height: 60px; font-size: 1.3rem; }
  .tile-btn.other-tile { width: 52px; }
  .tile-selector { gap: 3px; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>清一色 听牌分析</h1>
    <p>麻将清一色听牌判定 · 最优打牌建议</p>
  </header>

  <div class="input-section">
    <label>点击牌面添加手牌（右键或长按移除）· 13张判断听牌 · 14张判断和牌与打牌建议</label>

    <div class="tile-row-label">数牌 (可组顺子、刻子)</div>
    <div class="tile-selector" id="suitSelector"></div>

    <div class="tile-row-label">其他牌 (仅可组刻子/雀头，如字牌风牌)</div>
    <div class="tile-selector" id="otherSelector"></div>
  </div>

  <div class="info-box">
    💡 <b>其他牌</b>：用于表示非数牌（东南西北中发白等）。这些牌只能组成刻子或雀头，不能组顺子。每种最多4张，支持多种不同的其他牌。键盘按 <b>0</b> 添加。
    <b>你也可以用这里的牌来代表其他花色显然已经形成的对子/顺子/刻子。</b>
  </div>

  <div class="hand-display empty" id="handDisplay">
    <span class="hand-count" id="handCount">0 张</span>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="analyze()">分析</button>
    <button class="btn" onclick="undoTile()">撤销</button>
    <button class="btn btn-danger" onclick="clearHand()">清空</button>
  </div>

  <div id="results"></div>

  <footer>
    <a href="/">← 返回首页</a>
  </footer>
</div>

<script>
const TILE_CHARS = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const TILE_SUIT = '万';

// Other tile types: we support up to 7 kinds (indices 10-16)
// 10=东, 11=南, 12=西, 13=北, 14=中, 15=发, 16=白
const OTHER_TILES = [
  { id: 10, char: '東', label: '东风' },
  { id: 11, char: '南', label: '南风' },
  { id: 12, char: '西', label: '西风' },
  { id: 13, char: '北', label: '北风' },
  { id: 14, char: '中', label: '红中' },
  { id: 15, char: '發', label: '发财' },
  { id: 16, char: '白', label: '白板' },
];

// State
let hand = [];
let tileCounts = {}; // id -> count

function getCount(id) { return tileCounts[id] || 0; }
function setCount(id, v) { tileCounts[id] = v; }

function initSelector() {
  // Suit tiles 1-9
  const suitSel = document.getElementById('suitSelector');
  for (let i = 1; i <= 9; i++) {
    const btn = document.createElement('div');
    btn.className = 'tile-btn';
    btn.innerHTML = `
      <span class="tile-char">${TILE_CHARS[i]}</span>
      <span class="tile-label">${i}${TILE_SUIT}</span>
      <span class="tile-count" id="count-${i}">0</span>
    `;
    btn.addEventListener('click', (e) => { e.preventDefault(); addTile(i); });
    btn.addEventListener('contextmenu', (e) => { e.preventDefault(); removeTileByValue(i); });
    let pressTimer;
    btn.addEventListener('touchstart', (e) => {
      pressTimer = setTimeout(() => { e.preventDefault(); removeTileByValue(i); }, 500);
    }, {passive: false});
    btn.addEventListener('touchend', () => clearTimeout(pressTimer));
    btn.addEventListener('touchmove', () => clearTimeout(pressTimer));
    suitSel.appendChild(btn);
  }

  // Other tiles
  const otherSel = document.getElementById('otherSelector');
  for (const ot of OTHER_TILES) {
    const btn = document.createElement('div');
    btn.className = 'tile-btn other-tile';
    btn.innerHTML = `
      <span class="tile-char">${ot.char}</span>
      <span class="tile-label">${ot.label}</span>
      <span class="tile-count" id="count-${ot.id}">0</span>
    `;
    btn.addEventListener('click', (e) => { e.preventDefault(); addTile(ot.id); });
    btn.addEventListener('contextmenu', (e) => { e.preventDefault(); removeTileByValue(ot.id); });
    let pressTimer;
    btn.addEventListener('touchstart', (e) => {
      pressTimer = setTimeout(() => { e.preventDefault(); removeTileByValue(ot.id); }, 500);
    }, {passive: false});
    btn.addEventListener('touchend', () => clearTimeout(pressTimer));
    btn.addEventListener('touchmove', () => clearTimeout(pressTimer));
    otherSel.appendChild(btn);
  }
}

function addTile(id) {
  if (hand.length >= 14) return;
  if (getCount(id) >= 4) return;
  hand.push(id);
  setCount(id, getCount(id) + 1);
  updateDisplay();
}

function removeTileByValue(id) {
  const idx = hand.lastIndexOf(id);
  if (idx === -1) return;
  hand.splice(idx, 1);
  setCount(id, getCount(id) - 1);
  updateDisplay();
}

function undoTile() {
  if (hand.length === 0) return;
  const removed = hand.pop();
  setCount(removed, getCount(removed) - 1);
  updateDisplay();
}

function clearHand() {
  hand = [];
  tileCounts = {};
  updateDisplay();
  document.getElementById('results').innerHTML = '';
}

function getTileDisplay(id) {
  if (id >= 1 && id <= 9) return TILE_CHARS[id];
  const ot = OTHER_TILES.find(o => o.id === id);
  return ot ? ot.char : '?';
}

function isOtherTile(id) { return id >= 10; }

function updateDisplay() {
  // Update counts on selectors
  for (let i = 1; i <= 9; i++) {
    const el = document.getElementById(`count-${i}`);
    const c = getCount(i);
    el.textContent = c;
    el.className = c > 0 ? 'tile-count visible' : 'tile-count';
  }
  for (const ot of OTHER_TILES) {
    const el = document.getElementById(`count-${ot.id}`);
    const c = getCount(ot.id);
    el.textContent = c;
    el.className = c > 0 ? 'tile-count visible' : 'tile-count';
  }

  // Hand display: suit tiles sorted, then other tiles sorted
  const suitTiles = hand.filter(t => t <= 9).sort((a, b) => a - b);
  const otherTilesInHand = hand.filter(t => t >= 10).sort((a, b) => a - b);

  const disp = document.getElementById('handDisplay');
  let html = '';

  for (const t of suitTiles) {
    html += `<div class="hand-tile" onclick="removeTileFromHand(${t})" title="点击移除">${getTileDisplay(t)}</div>`;
  }

  if (suitTiles.length > 0 && otherTilesInHand.length > 0) {
    html += `<div class="hand-separator"></div>`;
  }

  for (const t of otherTilesInHand) {
    html += `<div class="hand-tile other" onclick="removeTileFromHand(${t})" title="点击移除">${getTileDisplay(t)}</div>`;
  }

  html += `<span class="hand-count">${hand.length} 张</span>`;
  disp.innerHTML = html;
  disp.className = hand.length === 0 ? 'hand-display empty' : 'hand-display';
}

function removeTileFromHand(id) {
  removeTileByValue(id);
}

// =========== Mahjong Logic ===========
// Strategy: "other" tiles (id >= 10) can only form triplets (刻子) or pairs (雀头).
// We first try to decompose other tiles into triplets, leaving 0 or 2 for pair.
// Then the suit tiles (1-9) are decomposed normally.

function canDecomposeMentsu(tiles) {
  let i = 1;
  while (i <= 9 && tiles[i] === 0) i++;
  if (i > 9) return true;

  if (tiles[i] >= 3) {
    tiles[i] -= 3;
    if (canDecomposeMentsu(tiles)) { tiles[i] += 3; return true; }
    tiles[i] += 3;
  }

  if (i <= 7 && tiles[i] >= 1 && tiles[i+1] >= 1 && tiles[i+2] >= 1) {
    tiles[i]--; tiles[i+1]--; tiles[i+2]--;
    if (canDecomposeMentsu(tiles)) { tiles[i]++; tiles[i+1]++; tiles[i+2]++; return true; }
    tiles[i]++; tiles[i+1]++; tiles[i+2]++;
  }

  return false;
}

// Check if other tiles can be fully decomposed into triplets (all counts must be 0 or 3)
// Returns true if possible
function canDecomposeOtherAsTrips(otherCounts) {
  for (const c of otherCounts) {
    if (c !== 0 && c !== 3) return false;
  }
  return true;
}

// Get all possible pair candidates from other tiles
// Returns array of {id, remaining_other_counts} where one pair is removed
function getOtherPairOptions(otherIds, otherCounts) {
  const options = [];
  for (let i = 0; i < otherIds.length; i++) {
    if (otherCounts[i] >= 2) {
      const newCounts = [...otherCounts];
      newCounts[i] -= 2;
      // Check remaining can all be triplets
      let valid = true;
      for (const c of newCounts) {
        if (c !== 0 && c !== 3) { valid = false; break; }
      }
      if (valid) options.push(otherIds[i]);
    }
  }
  return options;
}

function buildState(handArr) {
  const suitTiles = new Array(10).fill(0); // 1-9
  const otherMap = {}; // id -> count

  for (const t of handArr) {
    if (t <= 9) {
      suitTiles[t]++;
    } else {
      otherMap[t] = (otherMap[t] || 0) + 1;
    }
  }

  const otherIds = Object.keys(otherMap).map(Number).sort();
  const otherCounts = otherIds.map(id => otherMap[id]);

  return { suitTiles, otherIds, otherCounts };
}

function isWinning14(handArr) {
  if (handArr.length !== 14) return false;

  const { suitTiles, otherIds, otherCounts } = buildState(handArr);
  const suitTotal = suitTiles.reduce((a, b) => a + b, 0);
  const otherTotal = otherCounts.reduce((a, b) => a + b, 0);

  // We need exactly 1 pair and rest as mentsu (triplets/sequences)
  // The pair can come from suit tiles or other tiles

  // Case 1: Pair from suit tiles, others must all be triplets
  if (canDecomposeOtherAsTrips(otherCounts)) {
    // Remaining suit tiles = suitTotal, other tiles consumed as triplets
    // suitTotal must be 14 - otherTotal, and we need 1 pair from suit + rest mentsu
    for (let i = 1; i <= 9; i++) {
      if (suitTiles[i] >= 2) {
        suitTiles[i] -= 2;
        if (canDecomposeMentsu(suitTiles)) { suitTiles[i] += 2; return true; }
        suitTiles[i] += 2;
      }
    }
  }

  // Case 2: Pair from other tiles
  const pairOptions = getOtherPairOptions(otherIds, otherCounts);
  for (const pairId of pairOptions) {
    // Other tiles minus this pair must be all triplets (already verified in getOtherPairOptions)
    // Suit tiles must decompose fully into mentsu
    if (suitTotal % 3 === 0 && canDecomposeMentsu(suitTiles)) {
      return true;
    }
  }

  // Seven pairs check (all tiles in pairs)
  if (handArr.length === 14) {
    const allCounts = {...buildFullCounts(handArr)};
    let pairs = 0;
    let valid = true;
    for (const id in allCounts) {
      const c = allCounts[id];
      if (c === 2 || c === 4) pairs += Math.floor(c / 2);
      else { valid = false; break; }
    }
    if (valid && pairs === 7) return true;
  }

  return false;
}

function buildFullCounts(handArr) {
  const counts = {};
  for (const t of handArr) {
    counts[t] = (counts[t] || 0) + 1;
  }
  return counts;
}

function getTenpaiWaits13(handArr) {
  const waits = [];
  const counts = buildFullCounts(handArr);

  // Try adding each suit tile 1-9
  for (let t = 1; t <= 9; t++) {
    if ((counts[t] || 0) >= 4) continue;
    const testHand = [...handArr, t];
    if (isWinning14(testHand)) waits.push(t);
  }

  // Try adding each other tile type that's already in hand
  const otherInHand = new Set(handArr.filter(t => t >= 10));
  for (const t of otherInHand) {
    if ((counts[t] || 0) >= 4) continue;
    const testHand = [...handArr, t];
    if (isWinning14(testHand)) {
      if (!waits.includes(t)) waits.push(t);
    }
  }

  return waits;
}

// =========== Analysis ===========

function analyze() {
  const results = document.getElementById('results');

  if (hand.length !== 13 && hand.length !== 14) {
    results.innerHTML = `<div class="error-msg">请输入13或14张牌（当前 ${hand.length} 张）</div>`;
    return;
  }

  if (hand.length === 13) {
    const waits = getTenpaiWaits13(hand);
    if (waits.length === 0) {
      results.innerHTML = `
        <div class="result-card result-none">
          <h3>未听牌</h3>
          <p style="color:var(--text-dim);font-size:0.9rem;">当前手牌不在听牌状态</p>
        </div>`;
    } else {
      const counts = buildFullCounts(hand);
      let totalRemain = 0;
      const waitHtml = waits.map(w => {
        const rem = 4 - (counts[w] || 0);
        totalRemain += rem;
        const isOther = w >= 10;
        const cls = isOther ? 'hand-tile other' : 'hand-tile';
        const style = isOther
          ? 'cursor:default;border-color:var(--green);background:linear-gradient(170deg,#e8f0f8,#dce8f0);'
          : 'cursor:default;border-color:var(--green);background:linear-gradient(170deg,#f0f8f2,#e5efe8);';
        return `<div class="wait-tile">
          <div class="${cls}" style="${style}">${getTileDisplay(w)}</div>
          <span class="remaining">${rem}张</span>
        </div>`;
      }).join('');

      results.innerHTML = `
        <div class="result-card result-tenpai">
          <h3>🀄 听牌！</h3>
          <div class="wait-tiles">${waitHtml}</div>
          <p class="wait-summary">共 ${waits.length} 种 ${totalRemain} 张</p>
        </div>`;
    }
  } else {
    // 14 tiles
    if (isWinning14(hand)) {
      results.innerHTML = `
        <div class="result-card result-win">
          <h3>🏆 已经和牌！</h3>
        </div>`;
    } else {
      const options = [];
      const uniqueTiles = [...new Set(hand)].sort((a, b) => a - b);

      for (const d of uniqueTiles) {
        const testHand = hand.filter((t, idx) => {
          // Remove first occurrence of d
          if (t === d) { 
            // Mark as removed by checking if we already removed one
            return false; 
          }
          return true;
        });
        // The filter above removes ALL occurrences, we only want to remove one
        const testHand2 = [...hand];
        const removeIdx = testHand2.indexOf(d);
        testHand2.splice(removeIdx, 1);

        const waits = getTenpaiWaits13(testHand2);
        if (waits.length > 0) {
          const countsAfter = buildFullCounts(testHand2);
          let cnt = 0;
          for (const w of waits) cnt += (4 - (countsAfter[w] || 0));
          options.push({ tile: d, waits, waitCount: cnt });
        }
      }

      if (options.length === 0) {
        results.innerHTML = `
          <div class="result-card result-none">
            <h3>未和牌</h3>
            <p style="color:var(--text-dim);font-size:0.9rem;">打任何牌都无法听牌，需要更多巡摸牌</p>
          </div>`;
      } else {
        options.sort((a, b) => {
          if (a.waitCount !== b.waitCount) return b.waitCount - a.waitCount;
          return b.waits.length - a.waits.length;
        });

        const bestCount = options[0].waitCount;

        const optHtml = options.map(opt => {
          const isBest = opt.waitCount === bestCount;
          const isOtherDiscard = opt.tile >= 10;

          // Get counts after discard for accurate remaining
          const testHand2 = [...hand];
          testHand2.splice(testHand2.indexOf(opt.tile), 1);
          const countsAfter = buildFullCounts(testHand2);

          const waitHtml = opt.waits.map(w => {
            const rem = 4 - (countsAfter[w] || 0);
            const isOW = w >= 10;
            const cls = isOW ? 'hand-tile other' : 'hand-tile';
            const style = isOW
              ? 'cursor:default;border-color:var(--green);background:linear-gradient(170deg,#e8f0f8,#dce8f0);width:32px;height:44px;font-size:0.8rem;'
              : 'cursor:default;border-color:var(--green);background:linear-gradient(170deg,#f0f8f2,#e5efe8);width:32px;height:44px;font-size:1rem;';
            return `<div class="wait-tile">
              <div class="${cls}" style="${style}">${getTileDisplay(w)}</div>
              <span class="remaining">${rem}张</span>
            </div>`;
          }).join('');

          const discardCls = isOtherDiscard ? 'discard-tile other' : 'discard-tile';

          return `<div class="discard-option ${isBest ? 'best' : ''}">
            <div class="discard-option-header">
              ${isBest ? '<span class="star">★</span>' : '<span style="width:1.1rem;display:inline-block"></span>'}
              <span class="discard-label">打</span>
              <span class="${discardCls}">${getTileDisplay(opt.tile)}</span>
              <span class="discard-label">→ 听 ${opt.waits.length}种 ${opt.waitCount}张</span>
            </div>
            <div class="wait-tiles">${waitHtml}</div>
          </div>`;
        }).join('');

        results.innerHTML = `
          <div class="result-card">
            <h3>未和牌 · 打牌建议</h3>
            ${optHtml}
            <p class="wait-summary" style="margin-top:1rem;">★ 为推荐打法（听口最宽）</p>
          </div>`;
      }
    }
  }
}

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '9') addTile(parseInt(e.key));
  else if (e.key === '0') {
    // Add next available "other" tile, or cycle through them
    // Find which other tiles are in hand, add same type or new type
    const otherInHand = hand.filter(t => t >= 10);
    if (otherInHand.length === 0) {
      addTile(10); // Start with 東
    } else {
      // Add the most recently added other tile type
      const lastOther = otherInHand[otherInHand.length - 1];
      if (getCount(lastOther) < 4) {
        addTile(lastOther);
      } else {
        // Find next other tile type
        const nextIdx = OTHER_TILES.findIndex(o => o.id === lastOther) + 1;
        if (nextIdx < OTHER_TILES.length) {
          addTile(OTHER_TILES[nextIdx].id);
        }
      }
    }
  }
  else if (e.key === 'Backspace') { e.preventDefault(); undoTile(); }
  else if (e.key === 'Enter') analyze();
  else if (e.key === 'Escape') clearHand();
});

initSelector();
</script>

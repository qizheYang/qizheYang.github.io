<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清一色听牌分析器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #1a1a1a;
  --surface: #242424;
  --surface-hover: #2e2e2e;
  --border: #3a3a3a;
  --text: #e8e0d4;
  --text-dim: #8a8278;
  --accent: #c7956d;
  --accent-bright: #e0b088;
  --gold: #d4a853;
  --red: #c44d3a;
  --green: #5a9e6f;
  --tile-face: #f5f0e8;
  --tile-shadow: #c8bfb0;
  --tile-border: #a89e90;
  --tile-selected: #ffeedd;
}

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Subtle texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* Header */
header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 3rem;
  color: var(--accent-bright);
  letter-spacing: 0.15em;
  margin-bottom: 0.3rem;
  text-shadow: 0 2px 20px rgba(199, 149, 109, 0.3);
}

header p {
  color: var(--text-dim);
  font-size: 0.9rem;
  letter-spacing: 0.05em;
}

/* Tile input area */
.input-section {
  margin-bottom: 2rem;
}

.input-section label {
  display: block;
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
  letter-spacing: 0.03em;
}

/* Mahjong tile selector */
.tile-selector {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.tile-btn {
  width: 58px;
  height: 76px;
  border: 2px solid var(--tile-border);
  border-radius: 6px;
  background: linear-gradient(170deg, var(--tile-face) 0%, #ece5d8 100%);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 1.8rem;
  font-weight: 900;
  color: #2a2520;
  box-shadow: 0 3px 0 var(--tile-shadow), 0 4px 8px rgba(0,0,0,0.3);
  transition: all 0.12s ease;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.tile-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 0 var(--tile-shadow), 0 6px 12px rgba(0,0,0,0.35);
}

.tile-btn:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 var(--tile-shadow), 0 2px 4px rgba(0,0,0,0.25);
}

.tile-btn .tile-count {
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  color: #fff;
  background: var(--red);
  border-radius: 50%;
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.15s ease;
}

.tile-btn .tile-count.visible {
  opacity: 1;
  transform: scale(1);
}

.tile-btn .tile-label {
  font-size: 0.6rem;
  color: var(--red);
  font-weight: 700;
  margin-top: -2px;
  letter-spacing: -0.02em;
}

/* Chinese number labels for tiles */
.tile-char {
  line-height: 1;
}

/* Hand display */
.hand-display {
  min-height: 68px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 1rem;
  position: relative;
}

.hand-display.empty::after {
  content: '点击上方牌面添加手牌...';
  color: var(--text-dim);
  font-size: 0.85rem;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.hand-tile {
  width: 38px;
  height: 52px;
  border: 1.5px solid var(--tile-border);
  border-radius: 4px;
  background: linear-gradient(170deg, var(--tile-face) 0%, #ece5d8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 1.2rem;
  font-weight: 900;
  color: #2a2520;
  box-shadow: 0 2px 0 var(--tile-shadow), 0 2px 4px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: all 0.12s ease;
  animation: tileIn 0.2s ease;
}

@keyframes tileIn {
  from { transform: scale(0.7) translateY(-10px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.hand-tile:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 0 var(--tile-shadow), 0 6px 12px rgba(0,0,0,0.3);
  border-color: var(--red);
}

.hand-count {
  position: absolute;
  right: 12px;
  top: -10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2px 10px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* Controls */
.controls {
  display: flex;
  gap: 10px;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.03em;
}

.btn:hover { background: var(--surface-hover); border-color: var(--accent); }

.btn-primary {
  background: var(--accent);
  color: #1a1a1a;
  border-color: var(--accent);
  font-weight: 700;
}

.btn-primary:hover {
  background: var(--accent-bright);
  border-color: var(--accent-bright);
}

.btn-danger {
  border-color: var(--red);
  color: var(--red);
}

.btn-danger:hover {
  background: var(--red);
  color: #fff;
}

/* Results */
.results {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
  margin-bottom: 1rem;
}

.result-card h3 {
  font-size: 1rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.result-win {
  border-color: var(--gold);
  background: linear-gradient(135deg, var(--surface) 0%, rgba(212, 168, 83, 0.08) 100%);
}

.result-win h3 { color: var(--gold); }

.result-tenpai {
  border-color: var(--green);
  background: linear-gradient(135deg, var(--surface) 0%, rgba(90, 158, 111, 0.08) 100%);
}

.result-tenpai h3 { color: var(--green); }

.result-none h3 { color: var(--text-dim); }

/* Wait tiles display */
.wait-tiles {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 0.75rem;
}

.wait-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.wait-tile .hand-tile {
  cursor: default;
  border-color: var(--green);
  background: linear-gradient(170deg, #f0f8f2 0%, #e5efe8 100%);
}

.wait-tile .remaining {
  font-size: 0.7rem;
  color: var(--text-dim);
}

.wait-summary {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-top: 0.5rem;
}

/* Discard options */
.discard-option {
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 0.75rem;
  transition: all 0.15s ease;
  background: transparent;
}

.discard-option.best {
  border-color: var(--gold);
  background: rgba(212, 168, 83, 0.05);
}

.discard-option-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 0.5rem;
}

.discard-option-header .star {
  color: var(--gold);
  font-size: 1.1rem;
}

.discard-label {
  font-size: 0.85rem;
  color: var(--text-dim);
}

.discard-tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 44px;
  border: 1.5px solid var(--red);
  border-radius: 4px;
  background: linear-gradient(170deg, #fdf0e8 0%, #f5e5d8 100%);
  font-family: 'Noto Serif SC', serif;
  font-size: 1rem;
  font-weight: 900;
  color: var(--red);
  box-shadow: 0 2px 0 #d4b8a0;
}

/* Error */
.error-msg {
  padding: 0.75rem 1rem;
  background: rgba(196, 77, 58, 0.1);
  border: 1px solid var(--red);
  border-radius: 6px;
  color: var(--red);
  font-size: 0.85rem;
  margin-bottom: 1rem;
  animation: fadeIn 0.2s ease;
}

/* Footer */
footer {
  text-align: center;
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.8rem;
}

footer a {
  color: var(--accent);
  text-decoration: none;
}

footer a:hover { text-decoration: underline; }

/* Responsive */
@media (max-width: 600px) {
  .container { padding: 1.5rem 1rem 3rem; }
  header h1 { font-size: 2.2rem; }
  .tile-btn { width: 50px; height: 66px; font-size: 1.5rem; }
  .hand-tile { width: 34px; height: 46px; font-size: 1rem; }
  .tile-selector { gap: 4px; }
}

@media (max-width: 400px) {
  .tile-btn { width: 44px; height: 60px; font-size: 1.3rem; }
  .tile-selector { gap: 3px; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>清一色 听牌分析</h1>
    <p>麻将清一色听牌判定 · 最优打牌建议</p>
  </header>

  <div class="input-section">
    <label>点击牌面添加手牌（右键或长按移除）· 13张判断听牌 · 14张判断和牌与打牌建议</label>
    <div class="tile-selector" id="tileSelector"></div>
  </div>

  <div class="hand-display empty" id="handDisplay">
    <span class="hand-count" id="handCount">0 张</span>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">分析</button>
    <button class="btn" id="undoBtn" onclick="undoTile()">撤销</button>
    <button class="btn btn-danger" onclick="clearHand()">清空</button>
  </div>

  <div id="results"></div>

  <footer>
    <a href="/">← 返回首页</a>
  </footer>
</div>

<script>
// Tile labels
const TILE_CHARS = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const TILE_SUIT = '万'; // can be changed

// State
let hand = []; // array of tile numbers 1-9
let tileCounts = new Array(10).fill(0); // index 1-9

// Init tile selector
function initSelector() {
  const sel = document.getElementById('tileSelector');
  for (let i = 1; i <= 9; i++) {
    const btn = document.createElement('div');
    btn.className = 'tile-btn';
    btn.innerHTML = `
      <span class="tile-char">${TILE_CHARS[i]}</span>
      <span class="tile-label">${i}${TILE_SUIT}</span>
      <span class="tile-count" id="count-${i}">0</span>
    `;
    btn.addEventListener('click', (e) => { e.preventDefault(); addTile(i); });
    btn.addEventListener('contextmenu', (e) => { e.preventDefault(); removeTileByValue(i); });
    // Long press for mobile
    let pressTimer;
    btn.addEventListener('touchstart', (e) => {
      pressTimer = setTimeout(() => { e.preventDefault(); removeTileByValue(i); }, 500);
    }, {passive: false});
    btn.addEventListener('touchend', () => clearTimeout(pressTimer));
    btn.addEventListener('touchmove', () => clearTimeout(pressTimer));
    sel.appendChild(btn);
  }
}

function addTile(n) {
  if (hand.length >= 14) return;
  if (tileCounts[n] >= 4) return;
  hand.push(n);
  tileCounts[n]++;
  updateDisplay();
}

function removeTileByValue(n) {
  const idx = hand.lastIndexOf(n);
  if (idx === -1) return;
  hand.splice(idx, 1);
  tileCounts[n]--;
  updateDisplay();
}

function undoTile() {
  if (hand.length === 0) return;
  const removed = hand.pop();
  tileCounts[removed]--;
  updateDisplay();
}

function clearHand() {
  hand = [];
  tileCounts = new Array(10).fill(0);
  updateDisplay();
  document.getElementById('results').innerHTML = '';
}

function updateDisplay() {
  // Update counts on selector
  for (let i = 1; i <= 9; i++) {
    const el = document.getElementById(`count-${i}`);
    el.textContent = tileCounts[i];
    el.className = tileCounts[i] > 0 ? 'tile-count visible' : 'tile-count';
  }

  // Update hand display
  const disp = document.getElementById('handDisplay');
  const sorted = [...hand].sort((a, b) => a - b);
  disp.innerHTML = sorted.map(t =>
    `<div class="hand-tile" onclick="removeTileFromHand(${t})" title="点击移除">${TILE_CHARS[t]}</div>`
  ).join('') + `<span class="hand-count" id="handCount">${hand.length} 张</span>`;
  disp.className = hand.length === 0 ? 'hand-display empty' : 'hand-display';
}

function removeTileFromHand(n) {
  removeTileByValue(n);
}

// =========== Mahjong Logic (ported from C++) ===========

function canDecomposeMentsu(tiles) {
  let i = 1;
  while (i <= 9 && tiles[i] === 0) i++;
  if (i > 9) return true;

  // Try triplet
  if (tiles[i] >= 3) {
    tiles[i] -= 3;
    if (canDecomposeMentsu(tiles)) { tiles[i] += 3; return true; }
    tiles[i] += 3;
  }

  // Try sequence
  if (i <= 7 && tiles[i] >= 1 && tiles[i+1] >= 1 && tiles[i+2] >= 1) {
    tiles[i]--; tiles[i+1]--; tiles[i+2]--;
    if (canDecomposeMentsu(tiles)) { tiles[i]++; tiles[i+1]++; tiles[i+2]++; return true; }
    tiles[i]++; tiles[i+1]++; tiles[i+2]++;
  }

  return false;
}

function isWinning(tiles) {
  let total = 0;
  for (let i = 1; i <= 9; i++) total += tiles[i];
  if (total !== 14) return false;

  // Standard: pair + 4 mentsu
  for (let i = 1; i <= 9; i++) {
    if (tiles[i] >= 2) {
      tiles[i] -= 2;
      if (canDecomposeMentsu(tiles)) { tiles[i] += 2; return true; }
      tiles[i] += 2;
    }
  }

  // Seven pairs
  let pairs = 0;
  for (let i = 1; i <= 9; i++) {
    if (tiles[i] === 2 || tiles[i] === 4) pairs += Math.floor(tiles[i] / 2);
    else if (tiles[i] !== 0) { pairs = -1; break; }
  }
  if (pairs === 7) return true;

  return false;
}

function getTenpaiWaits(tiles) {
  const waits = [];
  for (let t = 1; t <= 9; t++) {
    if (tiles[t] >= 4) continue;
    tiles[t]++;
    if (isWinning(tiles)) waits.push(t);
    tiles[t]--;
  }
  return waits;
}

// =========== Analysis ===========

function analyze() {
  const results = document.getElementById('results');

  if (hand.length !== 13 && hand.length !== 14) {
    results.innerHTML = `<div class="error-msg">请输入13或14张牌（当前 ${hand.length} 张）</div>`;
    return;
  }

  // Build tiles array
  const tiles = new Array(10).fill(0);
  for (const t of hand) tiles[t]++;

  if (hand.length === 13) {
    // Tenpai check
    const waits = getTenpaiWaits(tiles);
    if (waits.length === 0) {
      results.innerHTML = `
        <div class="result-card result-none">
          <h3>未听牌</h3>
          <p style="color:var(--text-dim);font-size:0.9rem;">当前手牌不在听牌状态</p>
        </div>`;
    } else {
      let totalRemain = 0;
      const waitHtml = waits.map(w => {
        const rem = 4 - tiles[w];
        totalRemain += rem;
        return `<div class="wait-tile">
          <div class="hand-tile" style="cursor:default;border-color:var(--green);background:linear-gradient(170deg,#f0f8f2,#e5efe8);">${TILE_CHARS[w]}</div>
          <span class="remaining">${rem}张</span>
        </div>`;
      }).join('');

      results.innerHTML = `
        <div class="result-card result-tenpai">
          <h3>🀄 听牌！</h3>
          <div class="wait-tiles">${waitHtml}</div>
          <p class="wait-summary">共 ${waits.length} 种 ${totalRemain} 张</p>
        </div>`;
    }
  } else {
    // 14 tiles
    if (isWinning(tiles)) {
      results.innerHTML = `
        <div class="result-card result-win">
          <h3>🏆 已经和牌！</h3>
        </div>`;
    } else {
      // Find best discards
      const options = [];
      for (let d = 1; d <= 9; d++) {
        if (tiles[d] <= 0) continue;
        tiles[d]--;
        const waits = getTenpaiWaits(tiles);
        if (waits.length > 0) {
          let cnt = 0;
          for (const w of waits) cnt += (4 - tiles[w]);
          options.push({ tile: d, waits, waitCount: cnt });
        }
        tiles[d]++;
      }

      if (options.length === 0) {
        results.innerHTML = `
          <div class="result-card result-none">
            <h3>未和牌</h3>
            <p style="color:var(--text-dim);font-size:0.9rem;">打任何牌都无法听牌，需要更多巡摸牌</p>
          </div>`;
      } else {
        options.sort((a, b) => {
          if (a.waitCount !== b.waitCount) return b.waitCount - a.waitCount;
          return b.waits.length - a.waits.length;
        });

        const bestCount = options[0].waitCount;

        const optHtml = options.map(opt => {
          const isBest = opt.waitCount === bestCount;
          // Temporarily remove discarded tile for accurate remaining count
          tiles[opt.tile]--;
          const waitHtml = opt.waits.map(w => {
            const rem = 4 - tiles[w];
            return `<div class="wait-tile">
              <div class="hand-tile" style="cursor:default;border-color:var(--green);background:linear-gradient(170deg,#f0f8f2,#e5efe8);width:32px;height:44px;font-size:1rem;">${TILE_CHARS[w]}</div>
              <span class="remaining">${rem}张</span>
            </div>`;
          }).join('');
          tiles[opt.tile]++;

          return `<div class="discard-option ${isBest ? 'best' : ''}">
            <div class="discard-option-header">
              ${isBest ? '<span class="star">★</span>' : '<span style="width:1.1rem;display:inline-block"></span>'}
              <span class="discard-label">打</span>
              <span class="discard-tile">${TILE_CHARS[opt.tile]}</span>
              <span class="discard-label">→ 听 ${opt.waits.length}种 ${opt.waitCount}张</span>
            </div>
            <div class="wait-tiles">${waitHtml}</div>
          </div>`;
        }).join('');

        results.innerHTML = `
          <div class="result-card">
            <h3>未和牌 · 打牌建议</h3>
            ${optHtml}
            <p class="wait-summary" style="margin-top:1rem;">★ 为推荐打法（听口最宽）</p>
          </div>`;
      }
    }
  }
}

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '9') addTile(parseInt(e.key));
  else if (e.key === 'Backspace') undoTile();
  else if (e.key === 'Enter') analyze();
  else if (e.key === 'Escape') clearHand();
});

initSelector();
</script>
</body>
</html>
